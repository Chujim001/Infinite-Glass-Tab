  // ========== 简化版：智能触摸事件处理（已修复iOS重复打开标签页问题）==========
  // 修改点1：修复iOS重复打开标签页问题的关键修改 - 简化触摸事件处理
  // 统一使用click事件，避免触摸和鼠标事件冲突
  function setupSuggestionItemClickHandler(item, suggestion) {
    // 为每个建议项绑定统一的click事件处理器
    const handleSuggestionClick = function(e) {
      e.preventDefault(); // 阻止默认行为，防止可能的默认点击行为
      e.stopPropagation(); // 停止事件冒泡，防止事件传播到父元素

      // 从数据属性获取建议内容
      const suggestion = this.dataset.suggestion; // 从数据属性获取建议内容
      if (suggestion) {
        searchInput.value = suggestion; // 将建议内容设置到搜索输入框
        performSearch(); // 执行搜索
      }
      return false; // 返回false进一步阻止默认行为
    };

    // 只为每个建议项绑定一次click事件（使用once选项确保只触发一次）
    item.addEventListener('click', handleSuggestionClick, {
      passive: false, // 需要preventDefault所以不能使用passive
      once: false // 不使用once，因为建议项可能被重复使用
    });

    // 同时设置数据属性，供事件处理器使用
    item.dataset.suggestion = suggestion; // 将建议内容存储到数据属性中
  }

  // ========== 【v78 fix】handleSearchFocus：下一帧 rAF 加固聚焦类，防止 Safari 内部重绘清除 =====
  // 根因：macOS Safari 点击 type="search" 输入框时，浏览器内部会做一次原生搜索控件重绘，
  //       导致 search-focused/focused/blurred 类被瞬间移除，transform 动画回弹。
  //       表现为"搜索框向上跳动了一下随后瞬间回落"。
  // 修复：在下一帧（requestAnimationFrame）重新确认并加固聚焦类，覆盖 Safari 内部重绘的清零。
  function handleSearchFocus() {
    document.body.classList.add('search-focused'); // 添加搜索聚焦类
    searchWrapper.classList.add('focused'); // 添加搜索包装器聚焦类
    backgroundContainer.classList.add('blurred'); // 添加背景模糊类

    layoutManager.updateSuggestionsHeight(); // 更新建议框高度

    if (searchInput.value.trim()) {
      updateSuggestions(); // 如果输入框有内容，更新建议
    }

    // ===== 【v78 fix】下一帧重新确认聚焦类，防止 Safari 内部重绘清除导致动画回弹 =====
    requestAnimationFrame(() => {
      if (document.activeElement === searchInput) {
        // 如果输入框仍然拥有焦点，确保三个聚焦类都存在
        document.body.classList.add('search-focused');
        searchWrapper.classList.add('focused');
        backgroundContainer.classList.add('blurred');
      }
    });
  }

  // ========== 【v67 fix v3】handleSearchBlur：搜索触发时不取消聚焦状态，由 blur 自己清标志 =====
  // 根因：用 300ms 定时器清 _searchJustTriggered，切标签页回来定时器可能未执行，
  //       导致标志一直为 true，后续所有 blur 都被拦截，点击空白处无法取消聚焦。
  // 修复：不在定时器中清标志，而是由 handleSearchBlur 在跳过取消聚焦后自己清掉标志。
  //       这样标志只对紧跟搜索的那一次 blur 生效，后续 blur 恢复正常行为。
  function handleSearchBlur() {
    setTimeout(() => {
      // ===== 【v67 fix v3】由 blur 自己清标志，不留残留 =====
      if (window._searchJustTriggered) {
        window._searchJustTriggered = false; // 清标志，仅保护这一次 blur
        return;
      }

      const activeElement = document.activeElement; // 获取当前焦点元素
      // 如果焦点不在搜索输入框和建议框内
      if (activeElement !== searchInput && !suggestionsBox.contains(activeElement)) {
        document.body.classList.remove('search-focused'); // 移除搜索聚焦类
        searchWrapper.classList.remove('focused'); // 移除搜索包装器聚焦类
        backgroundContainer.classList.remove('blurred'); // 移除背景模糊类
        suggestionsBox.classList.remove('show'); // 隐藏建议框
        hideRaceStatus(); // 隐藏竞速状态
      }
    }, 200); // 延迟200ms处理（防止点击建议项时立即隐藏）
  }

  // ========== 简化版：更新建议（已修复iOS重复打开标签页问题）==========
  async function updateSuggestions() {
    const query = searchInput.value.trim(); // 获取搜索词并去除首尾空格
    suggestionsBox.classList.remove('show'); // 隐藏建议框
    hideRaceStatus(); // 隐藏竞速状态

    if (!query) {
      suggestionsContent.innerHTML = ''; // 清空建议内容
      return; // 直接返回
    }

    // 显示加载状态
    suggestionsContent.innerHTML = `
      <div class="suggestion-item">
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="suggestion-text">正在从多个搜索引擎获取最快建议...</span>
      </div>
    `;
    suggestionsBox.classList.add('show'); // 显示建议框

    layoutManager.updateSuggestionsHeight(); // 更新建议框高度

    let suggestions = []; // 初始化建议数组

    if (isOnline) {
      try {
        suggestions = await raceSearchEngines(query); // 竞速获取建议

        if (fastestEngine) {
          const resultTime = Date.now() - raceStartTime; // 计算耗时
          updateRaceStatus(fastestEngine, resultTime); // 更新竞速状态
        }
      } catch (error) {
        suggestions = getOfflineSuggestions(query); // 获取离线建议
        showOfflineStatus(); // 显示离线状态
      }
    } else {
      suggestions = getOfflineSuggestions(query); // 获取离线建议
      showOfflineStatus(); // 显示离线状态
    }

    suggestionsContent.innerHTML = ''; // 清空建议内容

    if (suggestions.length === 0) {
      // 没有建议时显示提示
      suggestionsContent.innerHTML = '<div class="no-suggestions">未找到相关建议</div>';
    } else {
      // 修改点4：修复updateSuggestions函数中的事件绑定逻辑
      // 遍历所有建议并创建DOM元素
      suggestions.forEach(suggestion => {
        const item = document.createElement('div'); // 创建建议项元素
        item.className = 'suggestion-item'; // 设置类名
        item.innerHTML = `
          <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="suggestion-text">${suggestion}</span>
        `;

        // 为建议项绑定点击事件处理
        setupSuggestionItemClickHandler(item, suggestion); // 使用统一的点击事件处理器

        suggestionsContent.appendChild(item); // 添加到建议内容容器
      });
    }

    layoutManager.updateSuggestionsHeight(); // 更新建议框高度
  }

  // ===== 【v67 fix v3】performSearch：去掉所有延迟和聚焦状态取消，由 blur 自己清标志 =====
  // 用户要求：点击搜索按钮 / 回车搜索 / 点击搜索建议三项行为，
  //          ① 不取消聚焦状态（不移除 search-focused/focused/blurred 类，不隐藏建议框和竞速状态）
  //          ② 不用延迟（去掉 800ms 和 500ms setTimeout）
  //          ③ 全平台适用
  // ===== 【v67 fix v3】不再用定时器清 _searchJustTriggered，由 handleSearchBlur 自己清 =====
  function performSearch() {
    if (window._searchPerforming) return;
    window._searchPerforming = true;

    const query = searchInput.value.trim();
    if (!query) {
      window._searchPerforming = false;
      return;
    }

    const engine = CONFIG.engines[currentEngine];
    const searchUrl = engine.url + encodeURIComponent(query);

    // 设置搜索触发标志，阻止 blur 处理取消聚焦
    // ===== 【v67 fix v3】标志由 handleSearchBlur 自己清除，不留任何定时器 =====
    window._searchJustTriggered = true;

    window.open(searchUrl, '_blank');

    // ===== 【v67 fix v3】_searchPerforming 立即释放，不需要延迟 =====
    window._searchPerforming = false;
  }

  /* ===== 修改点 D：修改 initEventListeners 中的背景上传逻辑 ===== */
  function initEventListeners() {
    // 搜索输入框焦点事件
    searchInput.addEventListener('focus', handleSearchFocus);
    searchInput.addEventListener('blur', handleSearchBlur);

    // ===== 【v77 fix】macOS Safari 聚焦修复：Safari 有时不触发 focus 事件，添加 click 事件作为兜底 =====
    searchInput.addEventListener('click', function(e) {
      // Safari 点击搜索框后若未进入聚焦状态，手动激活
      if (!document.body.classList.contains('search-focused')) {
        handleSearchFocus();
      }
    });

    // ===== 【自动填充修复】阻止 form 提交（防止回车键提交表单刷新页面） =====
    searchWrapper.addEventListener('submit', (e) => e.preventDefault());

    // 搜索输入框输入事件
    searchInput.addEventListener('input', () => {
      clearTimeout(window.suggestTimeout); // 清除之前的定时器
      window.suggestTimeout = setTimeout(updateSuggestions, 200); // 设置新的定时器（防抖）

      if (colorAdapter.initialized) {
        colorAdapter.analyzeAndAdapt(); // 如果颜色适应器已初始化，重新分析并适应
      }
    });

    // 搜索输入框按键事件
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch(); // 回车键执行搜索
    });

    // 搜索按钮点击事件
    searchBtn.addEventListener('click', performSearch);

    // 搜索引擎按钮点击事件
    engineBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        engineBtns.forEach(b => b.classList.remove('active')); // 移除所有按钮的激活状态
        this.classList.add('active'); // 添加当前按钮的激活状态
        currentEngine = this.dataset.engine; // 更新当前引擎

        saveEnginePreference(currentEngine); // 保存引擎偏好

        searchBtn.style.backgroundColor = CONFIG.engines[currentEngine].color; // 更新搜索按钮颜色
        if (searchInput.value.trim()) updateSuggestions(); // 如果输入框有内容，更新建议
      });
    });

    // 背景文件输入框变化事件 —— 修改点 D1：先显示缩略图，再异步加载原图替换
    bgFileInput.addEventListener('change', async function(event) {
      const file = event.target.files[0]; // 获取选择的文件
      if (!file) return; // 如果没有文件，直接返回

      if (!file.type.startsWith('image/')) {
        alert('请选择图片文件'); // 提示用户选择图片文件
        return;
      }

      const fileSizeMB = (file.size / 1024 / 1024).toFixed(2); // 计算文件大小（MB）
      console.log(`选择的背景图片大小: ${fileSizeMB} MB`);

      try {
        // 保存到IndexedDB（包含缩略图）
        await saveBackgroundToIndexedDB(file);

        // 从IndexedDB加载（优先使用缩略图）
        const bgData = await loadBackgroundFromIndexedDB();
        if (bgData) {
          // ----- 第一步：立即显示缩略图（如果有） -----
          if (bgData.thumbnailUrl) {
            backgroundImage.src = bgData.thumbnailUrl;
            backgroundImage.style.display = 'block';
            defaultBackground.style.display = 'none';
            backgroundImageSet = true;
            console.log('已显示缩略图，等待原图加载...');
          } else {
            // 没有缩略图（旧数据），直接显示原图
            backgroundImage.src = bgData.url;
            backgroundImage.style.display = 'block';
            defaultBackground.style.display = 'none';
            backgroundImageSet = true;
          }

          // 临时显示成功消息
          const originalHTML = bgUploadBtn.innerHTML;
          bgUploadBtn.innerHTML = `
            <svg class="bg-upload-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59L9 16.17Z" fill="white"/>
            </svg>
            <span class="bg-upload-tooltip">背景已设置 (${fileSizeMB}MB)</span>
          `;
          setTimeout(() => {
            bgUploadBtn.innerHTML = originalHTML;
            colorAdapter.restoreOriginalBGUploadBtn();
          }, 2000);

          // ----- 第二步：如果显示的是缩略图，异步加载原图替换 -----
          if (bgData.thumbnailUrl && bgData.url) {
            // 用 Image 对象预加载原图，不阻塞界面
            const fullImg = new Image();
            fullImg.onload = function() {
              // 原图加载完成，替换背景
              backgroundImage.src = bgData.url;
              console.log('原图加载完成，已替换缩略图');
              // 触发颜色适应器重新分析
              if (colorAdapter.initialized) {
                setTimeout(() => colorAdapter.analyzeAndAdapt(), 0);
              }
            };
            fullImg.onerror = function() {
              console.warn('原图加载失败，保留缩略图');
            };
            fullImg.src = bgData.url;
          }

          // 图片加载完成后重新分析并适应颜色（缩略图阶段）
          if (backgroundImage.complete) {
            setTimeout(() => colorAdapter.analyzeAndAdapt(), 0);
          } else {
            backgroundImage.addEventListener('load', () => {
              setTimeout(() => colorAdapter.analyzeAndAdapt(), 0);
            }, { once: true });
          }
        }
      } catch (error) {
        console.error('背景设置失败:', error); // 输出错误信息
        alert('背景设置失败，请重试'); // 提示用户
        colorAdapter.restoreOriginalBGUploadBtn(); // 恢复原始背景上传按钮
      }
    });

    // ===== 【v74 fix】文档点击事件：点击搜索框外部同时取消聚焦状态 =====
    // 根因：搜索后切回页面，输入框已失去焦点，点击空白处不触发 blur 事件，
    //       聚焦类（search-focused/focused/blurred）无法被移除，导致界面处于"假聚焦"状态。
    //       文档点击监听器作为兜底，无论输入框是否有焦点，点击外部直接取消所有聚焦类。
    // ===== 【v79 fix】macOS Safari 聚焦回弹终极修复：焦点在输入框时不再取消聚焦 =====
    // 根因：Safari 点击空的 type="search" 输入框时，会弹出原生搜索历史弹层，
    //       该弹层触发 click 事件时 e.target 不属于 searchWrapper 或 suggestionsBox，
    //       导致 v74 fix 误移除聚焦类，动画回弹。
    //       有文字时 Safari 不弹出原生弹层，因此 99% 成功（vs 40% 的差异根源）。
    // 修复：如果输入框当前拥有焦点（包括原生弹层打开时焦点仍在输入框），直接 return。
    document.addEventListener('click', function(e) {
      // ===== 【v79 fix】如果输入框当前拥有焦点，不取消聚焦（保护 Safari 原生弹层的聚焦状态）=====
      if (document.activeElement === searchInput) return;

      if (!searchWrapper.contains(e.target) && !suggestionsBox.contains(e.target)) {
        document.body.classList.remove('search-focused'); // 移除搜索聚焦类
        searchWrapper.classList.remove('focused'); // 移除搜索包装器聚焦类
        backgroundContainer.classList.remove('blurred'); // 移除背景模糊类
        suggestionsBox.classList.remove('show'); // 隐藏建议框
        hideRaceStatus(); // 隐藏竞速状态
      }
    });
  }

  /* ===== 修改点 E：修改 init 函数，先显示缩略图再异步加载原图 ===== */
  async function init() {

    // ==========【最终修复·桌面端兼容】仅 Android 设备锁定 body/html 高度为初始视口像素值 ==========
    // 问题：CSS 中 body { height: 100%; } 的 100% 参照的是动态视口高度。
    //       在 Android WebView 的 adjustResize 模式下，键盘弹出时 WebView 直接缩小视口高度
    //       （例如从 800px 缩小到 500px），导致 body 的 height: 100% 跟着从 800px 变成 500px，
    //       然后 justify-content: center 在 500px 的容器里重新居中 → 所有内容被"推"上去。
    // 解决：在页面初始化时（键盘尚未弹出），用 JS 读取真实的 window.innerHeight，
    //       以固定像素值写入 body/html 的行内 style（行内样式优先级高于 CSS），
    //       后续 WebView 视口如何变化，body 高度始终焊死在初始值，布局纹丝不动。
    // 桌面端例外：桌面浏览器没有 adjustResize 行为，锁定高度反而会导致窗口大小改变时
    //       出现白边（如 Edge 锁定在 676px 但窗口实际 710px）或内容溢出。
    //       因此仅在 Android 设备上执行高度锁定，桌面端保持 CSS height: 100% 自适应。
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid) {
      const INITIAL_VIEWPORT_HEIGHT = window.innerHeight;
      document.body.style.height = INITIAL_VIEWPORT_HEIGHT + 'px';
      document.body.style.minHeight = INITIAL_VIEWPORT_HEIGHT + 'px';
      document.documentElement.style.height = INITIAL_VIEWPORT_HEIGHT + 'px';
      console.log('【最终修复·桌面端兼容】Android：body/html 高度已锁定为: ' + INITIAL_VIEWPORT_HEIGHT + 'px，键盘弹出不会改变布局');
    } else {
      console.log('【最终修复·桌面端兼容】非 Android：跳过高度锁定，保持 CSS height: 100% 自适应 (当前: ' + window.innerHeight + 'px)');
    }

    suggestionsContent = document.getElementById('suggestions-content'); // 获取建议内容容器
    raceStatusContainer = document.getElementById('race-status-container'); // 获取竞速状态容器

    await checkNetwork(); // 检查网络状态

    try {
      await openBackgroundDB(); // 打开IndexedDB
      const bgData = await loadBackgroundFromIndexedDB(); // 加载背景图片
      if (bgData) {
        // ----- 第一步：立即显示缩略图（如果有） -----
        if (bgData.thumbnailUrl) {
          backgroundImage.src = bgData.thumbnailUrl;
          backgroundImage.style.display = 'block';
          defaultBackground.style.display = 'none';
          backgroundImageSet = true;
          console.log('已显示缩略图，正在后台加载原图...');
        } else {
          // 没有缩略图（旧数据），直接显示原图
          backgroundImage.src = bgData.url;
          backgroundImage.style.display = 'block';
          defaultBackground.style.display = 'none';
          backgroundImageSet = true;
          console.log('已加载原图（无缩略图）');
        }

        const fileSizeMB = (bgData.data.size / 1024 / 1024).toFixed(2); /* 计算文件大小 */
        console.log(`已加载保存的背景图片: ${bgData.data.name} (${fileSizeMB} MB)`);

        // ----- 第二步：如果显示的是缩略图，异步加载原图替换 -----
        if (bgData.thumbnailUrl && bgData.url) {
          // 用 Image 对象预加载原图，不阻塞界面
          const fullImg = new Image();
          fullImg.onload = function() {
            // 原图加载完成，替换背景
            backgroundImage.src = bgData.url;
            console.log('原图加载完成，已替换缩略图');
            // 触发颜色适应器重新分析
            if (colorAdapter.initialized) {
              setTimeout(() => colorAdapter.analyzeAndAdapt(), 0);
            }
          };
          fullImg.onerror = function() {
            console.warn('原图加载失败，保留缩略图');
          };
          fullImg.src = bgData.url;
        }

        // 缩略图加载完成后分析颜色适应
        if (backgroundImage.complete) {
          setTimeout(() => colorAdapter.analyzeAndAdapt(), 0);
        } else {
          backgroundImage.addEventListener('load', () => {
            setTimeout(() => colorAdapter.analyzeAndAdapt(), 0);
          }, { once: true });
        }
      } else {
        // 没有保存的背景，确保默认背景显示
        defaultBackground.style.display = 'block';
      }
    } catch (error) {
      console.warn('IndexedDB初始化失败或没有保存的背景:', error); /* 输出警告信息 */
      defaultBackground.style.display = 'block';
    }

    currentEngine = loadEnginePreference(); /* 加载引擎偏好 */

    // 设置激活的搜索引擎按钮
    engineBtns.forEach(btn => {
      btn.classList.remove('active'); /* 移除激活状态 */
      if (btn.dataset.engine === currentEngine) {
        btn.classList.add('active'); /* 添加激活状态 */
      }
    });

    searchBtn.style.backgroundColor = CONFIG.engines[currentEngine].color; /* 设置搜索按钮颜色 */

    initEventListeners(); /* 初始化事件监听器 */

    setTimeout(() => {
      colorAdapter.initialize(); /* 初始化颜色适应器 */
    }, 100);

    setInterval(checkNetwork, 15000); /* 每15秒检查一次网络状态 */

    // ===== 【v66 add】macOS Safari 修复：去掉 scale，只保留上移 =====
    // 根因：macOS Safari 的 transform:scale() 是将整个元素当作位图拉伸（不是重新渲染），
    //       导致文字、按钮、图标全部变模糊，无任何 CSS 或浏览器设置可以回避。
    //       其他浏览器（Edge/Chrome）无此问题，正确保留了缩放清晰度。
    // 修复：仅 macOS Safari 下聚焦时只上移（translateY）、不放大（去掉 scale(1.1)），
    //       交互反馈靠 translateY 位移动画撑住，所有元素始终清晰。
    if (/Safari/i.test(navigator.userAgent) && !/Chrome|Edg|CriOS/i.test(navigator.userAgent) && /Mac/i.test(navigator.userAgent) && !/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      const safariFixStyle = document.createElement('style');
      safariFixStyle.textContent = `
        /* macOS Safari: 聚焦时只上移，不放大（scale 导致位图拉伸模糊）*/
        body.search-focused .search-wrapper {
          transform: translateY(-250px) !important;
        }
        .search-wrapper.focused {
          transform: translateY(-60px) !important;
        }
        @media (max-width: 768px) {
          body.search-focused .search-wrapper { transform: translateY(-300px) !important; }
          .search-wrapper.focused { transform: translateY(-40px) !important; }
        }
        @media (max-width: 480px) {
          body.search-focused .search-wrapper { transform: translateY(-250px) !important; }
          .search-wrapper.focused { transform: translateY(-30px) !important; }
        }
      `;
      document.head.appendChild(safariFixStyle);
      console.log('【v66 add】macOS Safari 修复：聚焦时去掉 scale(1.1)，保留上移，元素清晰');
    }

    console.log('初始化完成，当前模式:', isOnline ? '在线' : '离线'); /* 输出初始化完成信息 */
    console.log('记忆的搜索引擎:', currentEngine);
    console.log('键盘布局管理器已启用（简化版：不再与浏览器原生行为冲突）'); /* 【修复】更新日志 */

    /* ===== 修改点 E 新增日志 ===== */

    /* 【修复】新增日志 */
